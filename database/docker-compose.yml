services:
  postgres:
    image: postgres:16
    container_name: retailmax-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: retailmax
      POSTGRES_USER: retailmax
      POSTGRES_PASSWORD: retailmax123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: